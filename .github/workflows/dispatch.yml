name: Funkin Dispatch

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: funkin-dispatch-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Check Go code
        run: |
          go test ./...
          go vet ./...

      - name: Check featured mods
        run: go run .
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save position state
        run: |
          git config user.name "Funkin Dispatch"
          git config user.email "funkin-dispatch@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update dispatch state"
          git push
